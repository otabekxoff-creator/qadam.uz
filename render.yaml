services:
  - type: web
    name: step-uz-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: step-db
          property: connectionString
      - key: NEXT_PUBLIC_API_URL
        value: https://step-backend.onrender.com/api

  - type: web
    name: step-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: step-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: otabekxoff@gmail.com
      - key: SMTP_PASS
        value: acyf sae vlob wblq
      - key: SMTP_FROM
        value: Step.uz <otabekxoff@gmail.com>
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://step-uz-frontend.onrender.com

databases:
  - name: step-db
    databaseName: step_uz_prod
    user: step_uz_user
    plan: free
    region: oregon
