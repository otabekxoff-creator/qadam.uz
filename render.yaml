services:
  - type: web
    name: step-uz-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://step-backend.onrender.com/api
      - key: NEXT_PUBLIC_APP_NAME
        value: Step.uz
      - key: NEXT_PUBLIC_APP_DESCRIPTION
        value: O'zbekiston yoshlari uchun karyera platformasi
      - key: NEXT_PUBLIC_ENABLE_CHAT
        value: true
      - key: NEXT_PUBLIC_ENABLE_NOTIFICATIONS
        value: true
      - key: NEXT_PUBLIC_ENABLE_VOICE_MESSAGES
        value: true

  - type: web
    name: step-backend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx tsc --noEmitOnError false --skipLibCheck
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: step-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: otabekxoff@gmail.com
      - key: SMTP_PASS
        value: acyf sae vlob wblq
      - key: SMTP_FROM
        value: Step.uz <otabekxoff@gmail.com>
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://step-uz-frontend.onrender.com
      - key: BACKEND_URL
        value: https://step-backend.onrender.com
      - key: LOG_LEVEL
        value: warn
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

databases:
  - name: step-db
    databaseName: step_uz_prod
    user: step_uz_user
    plan: free
    region: oregon
