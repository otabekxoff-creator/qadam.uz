services:
  - type: web
    name: step-uz
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: step-uz-db
          property: connectionString

databases:
  - name: step-uz-db
    plan: free
    databaseName: stepuz
